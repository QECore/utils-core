name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package tarball and consumer installation
        run: |
          TARBALL=$(npm pack)
          mkdir -p .smoke-consumer
          cd .smoke-consumer
          npm init -y
          npm install ../$TARBALL typescript @types/node
          node -e "const { resolve, combinations, combine } = require('utils-core'); const res = resolve([10, 20]).sum(); const cases = combinations({ a: [1, 2] }); const all = combine(cases, cases); if (res !== 30 || all.length !== 4) throw new Error('CJS failed'); console.log('CJS smoke test passed');"
          node --input-type=module -e "import { resolve, combinations, combine } from 'utils-core'; const res = resolve({ users: [{ name: 'Alice' }] }).get('users.name').first(); if (res !== 'Alice') throw new Error('ESM failed'); console.log('ESM smoke test passed');"
          cat << 'EOF' > tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2022",
              "moduleResolution": "nodenext",
              "module": "nodenext",
              "strict": true,
              "noEmit": true
            },
            "include": ["src"]
          }
          EOF
          mkdir src
          cat << 'EOF' > src/index.ts
          import { resolve, combinations, combine } from "utils-core";
          const data = { users: [{ name: "Alice", age: 30 }] };
          const names: string[] = resolve(data).get("users.name").values();
          const first: string | undefined = resolve(data).get("users.name").first();
          const cases = combinations({ browser: ["chrome", "firefox"] });
          const all = combine(cases, cases);
          EOF
          npx tsc
          cd ..
          rm -rf .smoke-consumer $TARBALL
