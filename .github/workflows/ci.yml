name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify package tarball and consumer installation
        run: |
          TARBALL=$(npm pack)
          mkdir -p smoke-consumer-test
          cd smoke-consumer-test
          npm init -y
          npm install ../$TARBALL typescript @types/node
          node -e "const { resolve, combinations, concat } = require('ts-lib-core'); const teams = [{ name: 'Core', lead: { role: 'admin' } }, { name: 'Ops', lead: { role: 'dev' } }]; const adminTeams = resolve(teams).filter('lead.role=admin').get('name'); const val = resolve([10, 20, 30]).at(1).first(); const hasAdmin = resolve(teams).some('lead.role=admin'); const cases = combinations({ a: [1, 2] }); const all = concat(cases, cases); if (adminTeams.length !== 1 || val !== 20 || !hasAdmin || all.length !== 4) throw new Error('CJS assertions failed'); console.log('CJS smoke test passed');"
          node --input-type=module -e "import { resolve, combinations, concat } from 'ts-lib-core'; const teams = [{ name: 'Core', lead: { role: 'admin' } }]; const res = resolve(teams).filter('lead.role=admin').get('name'); const val = resolve([10, 20, 30]).at(1).first(); const hasAdmin = resolve(teams).some('lead.role=admin'); const b = combinations({ b: [1, 2] }); const all = concat(b, b); if (res.length !== 1 || val !== 20 || !hasAdmin || all.length !== 4) throw new Error('ESM assertions failed'); console.log('ESM smoke test passed');"
          cat << 'EOF' > tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2022",
              "moduleResolution": "nodenext",
              "module": "nodenext",
              "strict": true,
              "noEmit": true
            },
            "include": ["src"]
          }
          EOF
          mkdir src
          cat << 'EOF' > src/index.ts
          import { resolve, combinations, concat } from "ts-lib-core";
          const data = {
            teams: [
              { name: "Platform", lead: { role: "admin" }, members: [{ name: "Alice", age: 30 }] },
              { name: "QA", lead: { role: "member" }, members: [{ name: "Bob", age: 25 }] },
            ],
          };
          const names: string[] = resolve(data).get("teams.members.name");
          const first = resolve(data.teams).first();
          const second = resolve(data.teams).at(1).first();
          const adminTeams = resolve(data.teams).filter("lead.role=admin").get("name");
          const hasAlice: boolean = resolve(names).some((name) => name === "Alice");
          const cases = combinations({ browser: ["chrome", "firefox"] });
          const all = concat(cases, cases);
          console.log("TS smoke check passed:", names.length, first?.name, second?.name, adminTeams.length, hasAlice, all.length);
          EOF
          npx tsc
          cd ..
          rm -rf smoke-consumer-test $TARBALL
