name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package tarball and consumer installation
        run: |
          TARBALL=$(npm pack)
          mkdir -p .smoke-consumer
          cd .smoke-consumer
          npm init -y
          npm install ../$TARBALL
          node -e "const { resolve, combinations, combine } = require('utils-core'); console.log('CJS smoke test passed:', typeof resolve, typeof combinations, typeof combine);"
          node --input-type=module -e "import { resolve, combinations, combine } from 'utils-core'; console.log('ESM smoke test passed:', typeof resolve, typeof combinations, typeof combine);"
          cd ..
          rm -rf .smoke-consumer $TARBALL
